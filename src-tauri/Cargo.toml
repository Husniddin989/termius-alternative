[package]
name = "termius-alternative"
version = "0.1.0"
description = "Cross-platform SSH client"
authors = ["husniddin989"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "termius_alternative_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = "0.63.3"
tokio = { version = "1.53.1", features = ["full"] }
async-trait = "0.1.92"
anyhow = "1.0.104"
uuid = { version = "1.26.1", features = ["v4"] }
tauri-plugin-dialog = "2.8.1"
russh-sftp = "3.0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
regex = "1.13.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
portable-pty = "0.9.0"

# Android has no system keychain the keyring crate can use; see secrets.rs.
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
